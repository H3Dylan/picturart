server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Compression : le JavaScript passe de ~590 à ~180 Ko, les données d'emojis de ~400 à ~70 Ko
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Fichiers versionnés par Vite : cache long
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker et manifeste : toujours revalidés, pour que les mises à jour arrivent
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Application monopage : toute route inconnue renvoie index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
