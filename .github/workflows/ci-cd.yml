name: CI / CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Images Docker
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/h3dylan/picturart-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Déploiement (CT 107)
    needs: images
    runs-on: [self-hosted, picturart]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: infra
      - name: Connexion à GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Mise à jour de la stack
        run: |
          cp infra/docker-compose.prod.yml /srv/picturart/compose.yml
          cd /srv/picturart
          docker compose up -d --pull always --remove-orphans
          docker image prune -f
      - name: Vérification
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose -f /srv/picturart/compose.yml logs --tail 50 api
          exit 1
      - name: Déconnexion de GHCR
        if: always()
        run: docker logout ghcr.io
