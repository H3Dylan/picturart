# Base de données pour le développement local : pnpm db:up
name: picturart-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: picturart
      POSTGRES_PASSWORD: picturart
      POSTGRES_DB: picturart
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U picturart']
      interval: 5s
      retries: 10

volumes:
  postgres-data:
