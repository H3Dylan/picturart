# Production sur le CT 107. Copié dans /srv/picturart/compose.yml à chaque déploiement.
# Secrets dans /srv/picturart/.env (jamais dans Git) : POSTGRES_PASSWORD, DATABASE_URL.
name: picturart

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: picturart
      POSTGRES_DB: picturart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - /srv/picturart/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U picturart']
      interval: 10s
      retries: 10

  api:
    image: ghcr.io/h3dylan/picturart-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant}
      APP_ORIGIN: https://pictur.dylanbouillon.fr
      MEDIA_DIR: /data/media
      PORT: 3000
      # Les médias sont traités par le service worker
      WORKER_INLINE: 'false'
    volumes:
      - /srv/picturart/media:/data/media
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  # Vignettes, HEIC et vidéos (ffmpeg + QuickSync de l'iGPU Intel), hors du processus de l'API
  worker:
    image: ghcr.io/h3dylan/picturart-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant}
      MEDIA_DIR: /data/media
      VIDEO_HWACCEL: auto
    volumes:
      - /srv/picturart/media:/data/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # Groupe « render » du CT 107, propriétaire de la carte (dev0 … gid=992 côté Proxmox)
    group_add:
      - '992'
    # Garde de la marge pour les autres services de l'Optiplex pendant un transcodage
    cpus: 4
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ghcr.io/h3dylan/picturart-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '8080:80'
